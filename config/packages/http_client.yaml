framework:
    http_client:
        # Caps parallel requests so the import stays gentle with the TCGdex servers.
        max_host_connections: 8
        scoped_clients:
            tcgdex.client:
                base_uri: 'https://api.tcgdex.net/v2/'
                headers:
                    Accept: 'application/json'
                timeout: 20
                retry_failed:
                    max_retries: 3
