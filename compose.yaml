version: "3.8"
services:
  db:
    image: pgvector/pgvector:pg18
    container_name: db
    environment:
      - POSTGRES_DB=${DB_DATABASE:-database}
      - POSTGRES_USER=${DB_USERNAME:-username}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      app.local:
        aliases:
          - pokedesk-db
  nginx:
    image: nginx:latest
    container_name: nginx
    depends_on:
      - php
    volumes:
      - ./public:/var/www/html/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - ./docker/volumes/var/run/php:/var/run/php
    networks:
      app.local:
        aliases:
          - pokedesk
  php:
    image: app/fpm
    build:
      context: ./
      target: build_dev
      dockerfile: docker/fpm/Dockerfile
    container_name: php
    depends_on:
      - db
    volumes:
      - ./:/var/www/html
#      - /etc/ssl/certs:/etc/ssl/certs:ro
      - ./docker/volumes/.bash_history:/home/symfony-quick-starter/.bash_history
      - ./docker/volumes/var/run/php:/var/run/php
    networks:
      - app.local
  mailer:
    image: axllent/mailpit
    container_name: mailer
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      app.local:
        aliases:
          - pokedesk-mail
  vision:
    image: pokedesk-vision
    build:
      context: ./vision
    container_name: vision
    environment:
      - VISION_MODEL=${VISION_MODEL:-clip-b32}
      - THREADS=${VISION_THREADS:-14}
      - HF_HOME=/models
    volumes:
      - ./vision:/app
      - vision-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      app.local:
        aliases:
          - pokedesk-vision

volumes:
  postgres-data: ~
  vision-models: ~

networks:
  app.local:
    name: app.local
